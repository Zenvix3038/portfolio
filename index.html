<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Studio</title>

  <style>
    :root {
      --bg: #0b0b0f;
      --text: #ffffff;
      --accent: #ff3c3c;
      --card: #15151d;
    }

    body.light {
      --bg: #ffffff;
      --text: #111;
      --card: #f2f2f2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 20px 50px;
      position: fixed;
      width: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1517602302552-471fe67acf66') center/cover;
    }

    .hero h1 {
      font-size: 60px;
    }

    .btn {
      padding: 12px 25px;
      background: var(--accent);
      border: none;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }

    section {
      padding: 100px 50px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>
<body>

<header>
  <h2>FilmStudio</h2>
  <nav>
    <a onclick="scrollToSection('home')">Home</a>
    <a onclick="scrollToSection('about')">About</a>
    <a onclick="scrollToSection('projects')">Projects</a>
    <a onclick="scrollToSection('contact')">Contact</a>
  </nav>
  <button onclick="toggleTheme()">🌙</button>
</header>

<section class="hero" id="home">
  <div>
    <h1>Creative Film Production</h1>
    <button class="btn" onclick="scrollToSection('projects')">View Work</button>
  </div>
</section>

<section id="about">
  <h2>About Us</h2>
  <p>High-end film production studio delivering cinematic excellence.</p>
</section>

<section id="projects">
  <h2>Our Projects</h2>
  <div class="grid">
    <div class="card">Project 1</div>
    <div class="card">Project 2</div>
    <div class="card">Project 3</div>
  </div>
</section>

<section id="contact">
  <h2>Contact</h2>
  <form onsubmit="submitForm(event)">
    <input type="text" placeholder="Name" required><br><br>
    <input type="email" placeholder="Email" required><br><br>
    <textarea placeholder="Message" required></textarea><br><br>
    <button class="btn">Send</button>
  </form>
</section>

<footer>
  <p>© 2026 Film Studio</p>
</footer>

<script>
  function scrollToSection(id) {
    document.getElementById(id).scrollIntoView({behavior:'smooth'});
  }

  function toggleTheme() {
    document.body.classList.toggle('light');
  }

  function submitForm(e) {
    e.preventDefault();
    alert('Message Sent Successfully!');
  }
</script>

</body>
</html>
